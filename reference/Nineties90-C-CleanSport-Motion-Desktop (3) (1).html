<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nineties90 · C Clean Sport · Motion · Desktop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Figtree:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Nineties90 store redesign — shared styles for all three directions.
   Each direction is a token set on .dir-a / .dir-b / .dir-c. 12-column grid, 8pt spacing. */

.nn{--rule:var(--accent);position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--bfam);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.nn *,.nn *::before,.nn *::after{box-sizing:border-box}
:where(.nn) button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;letter-spacing:inherit}
:where(.nn) h1,:where(.nn) h2,:where(.nn) h3,:where(.nn) h4,:where(.nn) p,:where(.nn) ul,:where(.nn) ol,:where(.nn) fieldset,:where(.nn) legend{margin:0;padding:0}
:where(.nn) ul,:where(.nn) ol{list-style:none}
:where(.nn) fieldset{border:0;min-width:0}
:where(.nn) strong{font-weight:600}
.nn :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.nn input,.nn select,.nn textarea{font:inherit;color:var(--ink)}

/* ---------- Direction A · Monochrome Editorial ---------- */
.dir-a{--bg:#F6F5F1;--surface:#FFFFFF;--ink:#111111;--muted:#5A5852;--line:#DCD9D1;--line-strong:#8A877F;--accent:#B4432B;--err:#B4432B;
 --slot:#E6E3DC;--slot-ink:#56534C;--btn-bg:#111111;--btn-ink:#F6F5F1;
 --band-bg:#111111;--band-ink:#F6F5F1;--band-muted:#B9B6AE;--band-btn-bg:#F6F5F1;--band-btn-ink:#111111;--util-bg:#111111;--util-ink:#F6F5F1;
 --dfam:'Instrument Serif',Georgia,serif;--bfam:'Geist',system-ui,sans-serif;--dweight:400;--dcase:none;--dtrack:-0.015em;--dlh:0.98;
 --h1:112px;--h2:64px;--h3:34px;--h4:24px;--radius:0px;--pill:0px;
 --logo-fam:'Geist',sans-serif;--logo-weight:600;--logo-track:0.28em;--logo-size:14px;--eb-track:0.16em}
/* ---------- Direction B · Warm Stone ---------- */
.dir-b{--bg:#EFEAE1;--surface:#F7F4EE;--ink:#2A2826;--muted:#5C564E;--line:#D5CDBF;--line-strong:#8C8375;--accent:#2F4A3A;--err:#8E2A2A;
 --slot:#E0D8CB;--slot-ink:#56504A;--btn-bg:#2F4A3A;--btn-ink:#F7F4EE;
 --band-bg:#2F4A3A;--band-ink:#F7F4EE;--band-muted:#C9D2CB;--band-btn-bg:#F7F4EE;--band-btn-ink:#2F4A3A;--util-bg:#2A2826;--util-ink:#EFEAE1;
 --dfam:'Fraunces',Georgia,serif;--bfam:'Figtree',system-ui,sans-serif;--dweight:400;--dcase:none;--dtrack:-0.01em;--dlh:1.04;
 --h1:76px;--h2:52px;--h3:30px;--h4:21px;--radius:2px;--pill:999px;
 --logo-fam:'Fraunces',serif;--logo-weight:500;--logo-track:0.16em;--logo-size:17px;--eb-track:0.14em}
/* ---------- Direction C · Clean Sport ---------- */
.dir-c{--bg:#FFFFFF;--surface:#F3F5F8;--ink:#0E1B33;--muted:#4A5568;--line:#E2E6ED;--line-strong:#7A879B;--accent:#D4FF3A;--err:#B42318;
 --slot:#EEF1F5;--slot-ink:#4A5568;--btn-bg:#D4FF3A;--btn-ink:#0E1B33;
 --band-bg:#0E1B33;--band-ink:#FFFFFF;--band-muted:#AEB8C8;--band-btn-bg:#D4FF3A;--band-btn-ink:#0E1B33;--util-bg:#0E1B33;--util-ink:#FFFFFF;
 --dfam:'Barlow Condensed',system-ui,sans-serif;--bfam:'Barlow',system-ui,sans-serif;--dweight:600;--dcase:uppercase;--dtrack:0.005em;--dlh:0.95;
 --h1:96px;--h2:60px;--h3:32px;--h4:22px;--radius:4px;--pill:4px;--rule:#0E1B33;
 --logo-fam:'Barlow Condensed',sans-serif;--logo-weight:700;--logo-track:0.12em;--logo-size:23px;--eb-track:0.18em}
.dir-c.nn{--rule:#0E1B33}

/* mobile type scale */
.is-m{--h1:52px;--h2:36px;--h3:24px;--h4:19px}
.is-m.dir-b{--h1:44px;--h2:34px}
.is-m.dir-c{--h1:58px;--h2:42px;--h3:28px}

/* ---------- type ---------- */
.d{font-family:var(--dfam);font-weight:var(--dweight);text-transform:var(--dcase);letter-spacing:var(--dtrack);line-height:var(--dlh)}
.h1{font-size:var(--h1)}
.h2{font-size:var(--h2)}
.h3{font-size:var(--h3);line-height:1.08}
.h4{font-size:var(--h4);line-height:1.2}
.nn em{font-style:normal}
.dir-a .h1 em,.dir-a .h2 em{font-style:italic}
.eyebrow{font-size:12px;letter-spacing:var(--eb-track);text-transform:uppercase;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:10px}
.dir-a .eyebrow::before{content:'';width:24px;height:1px;background:var(--accent);flex:none}
.dir-b .eyebrow{color:var(--accent)}
.dir-c .eyebrow{font-family:var(--dfam);font-weight:600;font-size:14px;color:var(--ink)}
.lead{font-size:18px;color:var(--muted);line-height:1.55}
.is-m .lead{font-size:16px}
.small{font-size:14px}
.xs{font-size:12px}
.muted{color:var(--muted)}
.strong{font-weight:600}
.center{text-align:center;justify-content:center}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}.mt40{margin-top:40px}.mt48{margin-top:48px}
.grow{flex:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- buttons & links ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 28px;background:var(--btn-bg);color:var(--btn-ink);font-size:15px;font-weight:500;border-radius:var(--radius);letter-spacing:.01em;transition:opacity .2s;white-space:nowrap;border:0}
.btn:hover{opacity:.86}
.btn[disabled]{opacity:.6;cursor:progress}
.dir-c .btn,.dir-c .btn-line{text-transform:uppercase;font-family:var(--dfam);font-weight:600;font-size:17px;letter-spacing:.07em}
.btn-line{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border:1px solid var(--ink);color:var(--ink);font-size:15px;font-weight:500;border-radius:var(--radius);white-space:nowrap;transition:background .2s}
.btn-line:hover{background:var(--surface)}
.btn-sm{min-height:44px;padding:0 18px;font-size:14px}
.dir-c .btn-sm{font-size:15px}
.btn-block{width:100%}
.tlink{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:15px;font-weight:500;text-decoration:underline;text-underline-offset:7px;text-decoration-thickness:1px;text-decoration-color:var(--rule);transition:text-decoration-thickness .15s}
.tlink:hover{text-decoration-thickness:2px}
.dir-c .tlink{font-family:var(--dfam);text-transform:uppercase;letter-spacing:.07em;font-size:16px;font-weight:600}
.ilink{text-decoration:underline;text-underline-offset:3px;font-weight:500}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:nnspin .8s linear infinite;flex:none}
@keyframes nnspin{to{transform:rotate(360deg)}}
.ic{width:20px;height:20px;flex:none}
.ic-s{width:16px;height:16px;flex:none}

/* ---------- layout ---------- */
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden}
.wrap{padding:0 64px}
.is-m .wrap{padding:0 16px}
.cols{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.st6.s2{grid-column:6 / span 2}.st6.s7{grid-column:6 / span 7}.st8.s5{grid-column:8 / span 5}.st9.s4{grid-column:9 / span 4}
.is-m .cols{display:flex;flex-direction:column;gap:32px}
.g2,.g3,.g4,.g5{display:grid;gap:24px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.is-m .g3,.is-m .g4,.is-m .g5{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 12px}
.is-m .g2{grid-template-columns:1fr;gap:12px}
.sec{padding:112px 0}
.is-m .sec{padding:64px 0}
.sec-top{border-top:1px solid var(--line)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:48px}
.sec-head .eyebrow{margin-bottom:16px}
.dir-b .sec-head{flex-direction:column;align-items:center;text-align:center;gap:16px}
.dir-b .sec-head .eyebrow{justify-content:center}
.is-m .sec-head{margin-bottom:28px;flex-direction:column;align-items:flex-start;gap:8px;text-align:left}
.is-m.dir-b .sec-head{align-items:center;text-align:center}
.rule{border:0;border-top:1px solid var(--line);margin:24px 0}

/* ---------- photo slots ---------- */
.slot{background:var(--slot);color:var(--slot-ink);position:relative;overflow:hidden;border-radius:var(--radius);display:block}
.slot-label{position:absolute;left:16px;right:16px;bottom:14px;font-size:12px;letter-spacing:.02em;display:flex;gap:8px;align-items:center;line-height:1.35;text-transform:none;font-family:var(--bfam);font-weight:400}
.slot-label .ic-s{opacity:.8}
.fill{position:absolute;inset:0}

/* ---------- UtilityBar ---------- */
.util{background:var(--util-bg);color:var(--util-ink);font-size:13px;min-height:36px;display:flex;align-items:center;justify-content:center;gap:14px;letter-spacing:.01em;padding:0 16px;text-align:center}
.util .sep{opacity:.55}
.dir-c .util{font-family:var(--dfam);text-transform:uppercase;letter-spacing:.1em;font-size:14px;font-weight:500}
.util-rot{animation:nnfade .5s ease}
@keyframes nnfade{from{opacity:0}to{opacity:1}}

/* ---------- Header / SportNav ---------- */
.hdr{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr-in{height:76px;display:flex;align-items:center;gap:32px;padding:0 64px}
.is-m .hdr-in{height:60px;padding:0 6px;gap:2px}
.logo{font-family:var(--logo-fam);font-weight:var(--logo-weight);letter-spacing:var(--logo-track);font-size:var(--logo-size);white-space:nowrap;min-height:44px;display:inline-flex;align-items:center;color:var(--ink)}
.dir-c .logo{font-style:italic}
.is-m .logo{padding:0 6px}
.nav{flex:1;display:flex;justify-content:center;gap:24px;align-self:stretch}
.navlink{font-size:14px;font-weight:500;display:flex;align-items:center;position:relative;white-space:nowrap}
.navlink::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--rule);transform:scaleX(0);transform-origin:left;transition:transform .25s ease}
.dir-c .navlink::after{height:2px}
.navlink:hover::after,.navlink.on::after{transform:scaleX(1)}
.dir-c .navlink{font-family:var(--dfam);text-transform:uppercase;font-size:16px;letter-spacing:.07em;font-weight:600}
.dir-b .navlink{font-size:15px}
.hdr-r{display:flex;align-items:center;gap:2px}
.hdr-r .btn-line{margin-left:12px}
.spacer{flex:1}
.ibtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;position:relative;border-radius:var(--radius);flex:none}
.ibtn:hover{background:var(--surface)}
.dir-c .ibtn:hover{background:var(--surface)}
.count{position:absolute;top:5px;right:3px;min-width:17px;height:17px;border-radius:9px;background:var(--ink);color:var(--bg);font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* ---------- MegaMenu ---------- */
.mega-shade{position:absolute;top:100%;left:0;right:0;height:3000px;background:rgba(17,17,17,.14);z-index:1;animation:nnfade .2s ease}
.mega{position:absolute;left:0;right:0;top:100%;background:var(--bg);border-bottom:1px solid var(--line);border-top:1px solid var(--line);z-index:2;animation:nnmega .24s ease both}
@keyframes nnmega{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.mega-in{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;padding:40px 64px 48px}
.mega-list{grid-column:1 / span 4;display:flex;flex-direction:column}
.mega-list .eyebrow{margin-bottom:12px}
.mega-link{font-family:var(--dfam);font-weight:var(--dweight);text-transform:var(--dcase);letter-spacing:var(--dtrack);font-size:26px;line-height:1.1;min-height:56px;padding:10px 0;display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--line);width:100%;transition:padding .2s}
.dir-b .mega-link{font-size:23px}
.dir-c .mega-link{font-size:24px}
.mega-link:hover{padding-left:6px}
.mega-hint{font-family:var(--bfam);font-size:13px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:400}
.mega-side{grid-column:6 / span 2;display:flex;flex-direction:column;gap:14px;padding-top:4px}
.mega-side .facts{display:flex;flex-direction:column;gap:10px;font-size:14px;color:var(--muted)}
.mega-feat{grid-column:8 / span 5;display:flex;flex-direction:column;gap:8px}
.mega-slot{height:300px}
.mega-groups{grid-column:1 / span 8;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px 24px}
.mg-t{font-size:12px;letter-spacing:var(--eb-track);text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:10px}
.dir-c .mg-t{font-family:var(--dfam);font-size:14px;font-weight:600;color:var(--ink)}
.mg-link{display:flex;align-items:center;min-height:40px;font-size:15px;width:100%;transition:padding .2s}
.mg-link:hover{padding-left:4px;text-decoration:underline;text-underline-offset:5px;text-decoration-color:var(--rule)}
.mega-feat-s{grid-column:9 / span 4;display:flex;flex-direction:column;gap:8px}
.search{position:absolute;left:0;right:0;top:100%;background:var(--bg);border-bottom:1px solid var(--line);padding:32px 64px 40px;z-index:2;animation:nnmega .24s ease both}
.is-m .search{padding:20px 16px 28px}
.search-input{font-family:var(--dfam);font-size:40px;text-transform:var(--dcase);border:0;border-bottom:1px solid var(--ink);background:transparent;width:100%;padding:8px 0;outline:none;border-radius:0}
.is-m .search-input{font-size:26px}
.chips{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- Hero ---------- */
.hero{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;align-items:end;padding:48px 0 88px}
.hero-text{display:flex;flex-direction:column;gap:24px}
.hero-sub{font-size:19px}
.cta{display:flex;align-items:center;gap:28px;flex-wrap:wrap;margin-top:8px}
.dir-a .hero-text{grid-column:1 / span 6;padding-bottom:12px}
.dir-a .hero-media{grid-column:7 / span 6;height:720px}
.dir-a .hero-sm .hero-media{height:560px}
.dir-b .hero{align-items:start;text-align:center;padding-top:24px}
.dir-b .hero-text{grid-column:3 / span 8;align-items:center;padding:48px 0 56px}
.dir-b .hero-media{grid-column:1 / span 12;height:560px}
.dir-b .hero-sm .hero-media{height:440px}
.dir-b .cta{justify-content:center}
.dir-c .hero{align-items:center}
.dir-c .hero-media{grid-column:1 / span 7;grid-row:1;height:640px}
.dir-c .hero-sm .hero-media{height:520px}
.dir-c .hero-text{grid-column:8 / span 5;grid-row:1;padding-left:24px}
.is-m .hero{display:flex;flex-direction:column;gap:28px;padding:24px 0 48px;align-items:stretch}
.is-m .hero-text{padding:0;gap:18px}
.is-m .hero-media{height:420px;width:100%;order:2}
.is-m .hero-sm .hero-media{height:320px}
.is-m.dir-b .hero-text{padding:16px 0 0}
.is-m .cta{flex-direction:column;align-items:stretch;gap:4px}
.is-m .cta .btn{width:100%}
.is-m .cta .tlink{justify-content:center}

/* ---------- TrustRow ---------- */
.trust{display:flex;align-items:center;justify-content:space-between;gap:32px;padding:28px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.crests{display:flex;gap:10px}
.crest{width:52px;height:52px;border-radius:50%;border:1px solid var(--line-strong);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted);letter-spacing:.04em;flex:none;background:var(--surface)}
.crest-lg{width:104px;height:104px;font-size:12px}
.rating{display:flex;align-items:center;gap:10px}
.stars{display:inline-flex;gap:2px;color:var(--ink)}
.dir-b .stars{color:var(--accent)}
.facts-row{display:flex;gap:28px}
.fact{font-size:14px;white-space:nowrap}
.fact-k{font-weight:600}
.dir-b .trust{flex-direction:column;gap:20px;text-align:center}
.dir-c .facts-row{gap:0}
.dir-c .fact{display:flex;flex-direction:column;padding:0 24px;border-left:1px solid var(--line)}
.dir-c .fact-k{font-family:var(--dfam);font-size:30px;line-height:1;text-transform:uppercase;font-weight:600}
.dir-c .fact-v{font-size:13px;color:var(--muted);margin-top:4px}
.is-m .trust{flex-direction:column;align-items:flex-start;gap:20px;padding:24px 0}
.is-m .crests{overflow-x:auto;max-width:100%}
.is-m .facts-row{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;width:100%}
.is-m .fact{white-space:normal}
.is-m.dir-c .fact{padding:0 0 0 12px}
.is-m.dir-b .trust{align-items:center}
.is-m.dir-b .facts-row{text-align:center}
.factbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.factbar li{display:flex;align-items:center;gap:12px;padding:22px 0;font-size:14px}
.factbar li + li{padding-left:24px;border-left:1px solid var(--line)}
.is-m .factbar{grid-template-columns:1fr 1fr}
.is-m .factbar li{padding:16px 0 16px 0;border-left:0}
.is-m .factbar li + li{padding-left:0;border-left:0}

/* ---------- SportTiles ---------- */
.tile{display:block;width:100%;text-align:left}
.tile-img{aspect-ratio:4 / 5;transition:opacity .3s}
.dir-c .tile-img{aspect-ratio:1 / 1}
.tile:hover .tile-img{opacity:.9}
.tile-meta{display:flex;justify-content:space-between;align-items:baseline;padding-top:16px;gap:12px}
.dir-b .tile-meta{flex-direction:column;align-items:center;gap:4px}
.is-m .tile-img{aspect-ratio:1 / 1}
.is-m .tile-meta{flex-direction:column;align-items:flex-start;gap:2px;padding-top:10px}
.is-m.dir-b .tile-meta{align-items:center}

/* ---------- HowItWorks ---------- */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.step{border-top:1px solid var(--ink);padding-top:24px;display:flex;flex-direction:column;gap:10px}
.dir-b .step{border-top-color:var(--line-strong)}
.dir-c .step{border-top-width:2px}
.step-n{font-family:var(--dfam);font-size:56px;line-height:1;margin-bottom:24px;font-weight:var(--dweight)}
.dir-a .step-n{font-style:italic}
.dir-b .step-n{color:var(--accent);font-size:44px}
.is-m .steps{grid-template-columns:1fr;gap:28px}
.is-m .step-n{font-size:36px;margin-bottom:8px}

/* ---------- ProductCard ---------- */
.pc{display:block;width:100%;text-align:left}
.pc-media{position:relative;display:block;aspect-ratio:4 / 5;background:var(--slot);overflow:hidden;border-radius:var(--radius)}
.pc-alt{position:absolute;inset:0;opacity:0;transition:opacity .35s ease;background:var(--slot);display:block}
.pc:hover .pc-alt{opacity:1}
.pc-name{display:block;margin-top:16px;font-size:15px;font-weight:500;line-height:1.35}
.dir-a .pc-name{text-transform:uppercase;letter-spacing:.08em;font-size:13px}
.dir-c .pc-name{font-family:var(--dfam);text-transform:uppercase;letter-spacing:.04em;font-size:19px;font-weight:600}
.pc-price{display:block;font-size:15px;color:var(--muted);margin-top:4px}
.dots{display:flex;gap:6px;margin-top:10px}
.dot{width:12px;height:12px;border-radius:50%;border:1px solid var(--line-strong);display:block}
.is-m .pc-name{margin-top:10px;font-size:14px}
.is-m.dir-a .pc-name{font-size:12px}
.is-m.dir-c .pc-name{font-size:17px}
.note-line{margin-top:40px;display:flex;gap:24px;flex-wrap:wrap}

/* ---------- ClubStories / Reviews ---------- */
.story-img{height:520px}
.is-m .story-img{height:300px}
.rev{padding:28px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.rev:first-child{border-top:0;padding-top:0}
.rev-q{font-family:var(--dfam);font-size:var(--h4);line-height:1.3;text-transform:none;font-weight:400}
.dir-c .rev-q{font-family:var(--bfam);font-size:19px;font-weight:500}
.revcard{background:var(--surface);padding:32px;display:flex;flex-direction:column;gap:16px;border-radius:var(--radius)}
.dir-a .revcard{background:transparent;border-top:1px solid var(--ink);padding:24px 0 0}
.is-m .revcard{padding:24px}
.is-m.dir-a .revcard{padding:20px 0 0}

/* ---------- Design Your Kit teaser ---------- */
.dyk{align-items:center}
.dyk-text{display:flex;flex-direction:column;gap:20px;align-items:flex-start}
.dyk-art{background:var(--slot);padding:40px;border-radius:var(--radius)}
.is-m .dyk-art{padding:16px}
.is-m .dyk-art .g3{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

/* ---------- FAQ ---------- */
.faq-item{border-top:1px solid var(--line)}
.faq-item:last-child{border-bottom:1px solid var(--line)}
.faq-q{width:100%;min-height:68px;display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:17px;font-weight:500;padding:16px 0}
.faq-a{padding:0 48px 24px 0;color:var(--muted);max-width:640px}
.is-m .faq-q{font-size:16px}
.is-m .faq-a{padding-right:0}

/* ---------- QuoteBand ---------- */
.band{background:var(--band-bg);color:var(--band-ink);padding:96px 0}
.is-m .band{padding:56px 0}
.band .muted{color:var(--band-muted)}
.band .eyebrow{color:var(--band-muted)}
.dir-c .band .eyebrow{color:var(--band-ink)}
.band .btn{background:var(--band-btn-bg);color:var(--band-btn-ink)}
.band .tlink{text-decoration-color:currentColor}
.band-in{align-items:end}
.band-act{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.is-m .band-act{align-items:stretch}
.is-m .band-act .tlink{justify-content:center}

/* ---------- Footer ---------- */
.ftr{border-top:1px solid var(--line);padding:80px 0 32px}
.is-m .ftr{padding:48px 0 96px}
.ftr .eyebrow{margin-bottom:14px}
.flink{display:flex;align-items:center;min-height:36px;font-size:14px;color:var(--muted);width:100%}
.flink:hover{color:var(--ink)}
.sub-row{display:flex;gap:8px;margin-top:8px}
.ftr-bottom{border-top:1px solid var(--line);margin-top:64px;padding-top:24px;display:flex;justify-content:space-between;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.ftr-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;padding-left:64px}
.is-m .ftr-cols{grid-template-columns:1fr 1fr;gap:28px 16px;padding-left:0}
.revcol{padding-left:24px}
.is-m .revcol{padding-left:0}
.is-m .ftr-bottom{margin-top:40px;flex-direction:column}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:8px}
.label{font-size:14px;font-weight:500}
.hint{font-size:13px;color:var(--muted)}
.input{min-height:52px;padding:0 16px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:var(--radius);width:100%;font-size:16px}
.input::placeholder{color:var(--muted)}
.dir-a .input{background:#FFFFFF}
textarea.input{min-height:120px;padding:14px 16px;resize:vertical;line-height:1.5}
.select{min-height:44px;padding:0 36px 0 12px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--radius);font-size:14px}
.chip{min-height:44px;padding:0 18px;border:1px solid var(--line-strong);border-radius:var(--pill);display:inline-flex;align-items:center;gap:8px;font-size:15px;transition:background .15s}
.chip:hover{background:var(--surface)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip-sm{min-height:40px;padding:0 14px;font-size:14px}
.opt{min-height:56px;border:1px solid var(--line-strong);padding:0 16px;display:flex;align-items:center;gap:12px;width:100%;border-radius:var(--radius);font-size:15px}
.opt.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.box{width:20px;height:20px;border:1px solid var(--line-strong);display:flex;align-items:center;justify-content:center;flex:none;border-radius:var(--radius)}
.opt.on .box{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:44px;height:44px;border-radius:50%;border:1px solid var(--line-strong);position:relative;flex:none}
.sw.on::after{content:'';position:absolute;inset:-5px;border:2px solid var(--ink);border-radius:50%}
.drop{border:1px dashed var(--line-strong);padding:32px 24px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;background:var(--surface);border-radius:var(--radius);cursor:pointer;width:100%}
.drop:hover{border-color:var(--ink)}
.check{display:flex;align-items:center;gap:12px;min-height:40px;font-size:15px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--ink);margin:0;flex:none}
.alert{border:1px solid var(--err);padding:16px 20px;display:flex;gap:12px;align-items:flex-start;background:var(--surface);border-radius:var(--radius);font-size:14px}
.alert .ic{color:var(--err)}
.skel{background:var(--slot);animation:nnpulse 1.4s ease-in-out infinite;border-radius:var(--radius);display:block}
@keyframes nnpulse{50%{opacity:.5}}
.prog{height:2px;background:var(--line);display:block;overflow:hidden}
.prog > span{display:block;height:100%;background:var(--rule);transition:width .4s ease}
.dir-c .prog{height:3px}

/* ---------- breadcrumbs, tabs ---------- */
.crumbs{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;min-height:56px;flex-wrap:wrap}
.crumbs button{min-height:44px}
.crumbs button:hover{color:var(--ink);text-decoration:underline}
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:32px}
.tab{min-height:48px;font-size:15px;color:var(--muted);position:relative;white-space:nowrap}
.tab.on{color:var(--ink);font-weight:500}
.tab.on::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--rule)}
.dir-c .tab{font-family:var(--dfam);text-transform:uppercase;letter-spacing:.07em;font-weight:600;font-size:16px}
.is-m .tabs{gap:20px;margin-bottom:20px}

/* ---------- sport landing ---------- */
.subtile{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left}
.subtile-img{display:block;aspect-ratio:1 / 1;background:var(--slot);overflow:hidden;border-radius:var(--radius);position:relative}
.subtile-img > *{position:absolute;left:0;right:0;top:-6%}
.subtile-name{font-weight:500;font-size:16px;line-height:1.3}
.dir-c .subtile-name{font-family:var(--dfam);text-transform:uppercase;font-size:20px;font-weight:600;letter-spacing:.03em}
.kitstyle{display:flex;flex-direction:column;gap:12px}
.kitstyle-art{background:var(--slot);display:block;border-radius:var(--radius);padding:24px}
.is-m .kitstyle-art{padding:12px}

/* ---------- category ---------- */
.cat-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding:8px 0 40px}
.is-m .cat-head{padding:0 0 24px}
.kitnote{display:flex;justify-content:space-between;align-items:center;gap:24px;background:var(--surface);padding:24px 32px;margin-bottom:40px;border-radius:var(--radius)}
.is-m .kitnote{flex-direction:column;align-items:stretch;padding:20px}
.cat-body{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;padding-bottom:112px}
.filters{grid-column:span 3;padding-right:24px}
.cat-main{grid-column:span 9}
.is-m .cat-body{display:block;padding-bottom:64px}
.fgroup{border-top:1px solid var(--line);padding:20px 0}
.fgroup:first-child{border-top:0;padding-top:0}
.fg-t{font-size:14px;font-weight:600;margin-bottom:10px}
.dir-c .fg-t{font-family:var(--dfam);text-transform:uppercase;letter-spacing:.08em;font-size:16px}
.szwrap{display:flex;flex-wrap:wrap;gap:6px}
.sz{min-width:52px;min-height:44px;padding:0 12px;border:1px solid var(--line-strong);display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius);font-size:14px}
.sz.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.price-row{display:flex;gap:10px;align-items:flex-end}
.price-row .input{min-height:44px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px;min-height:44px}
.sort{display:flex;align-items:center;gap:10px}
.pager{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:56px}
.errbox{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding:96px 24px;border:1px solid var(--line);border-radius:var(--radius)}

/* ---------- product ---------- */
.prod{padding-bottom:88px;align-items:start}
.gal-main{position:relative;display:block;aspect-ratio:4 / 5;background:var(--slot);overflow:hidden;border-radius:var(--radius)}
.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:12px}
.thumb{aspect-ratio:1 / 1;background:var(--slot);border:1px solid transparent;position:relative;overflow:hidden;display:block;border-radius:var(--radius)}
.thumb.on{border-color:var(--ink)}
.thumb .slot-label{left:8px;right:8px;bottom:8px;font-size:11px}
.info{display:flex;flex-direction:column;gap:12px;padding-left:24px;position:sticky;top:100px}
.is-m .info{padding-left:0;position:static}
.price{font-size:24px;font-weight:500}
.dir-c .price{font-family:var(--dfam);font-size:32px;font-weight:600}
.teamprice{font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.teamprice span:first-child{color:var(--muted)}
.opt-head{display:flex;justify-content:space-between;align-items:center}
.size-pills{display:flex;gap:8px;flex-wrap:wrap}
.buy-row{display:flex;gap:12px;margin-top:8px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line-strong);height:52px;border-radius:var(--radius);flex:none}
.qty button{width:44px;height:100%;display:flex;align-items:center;justify-content:center}
.qty span{min-width:28px;text-align:center;font-size:15px}
.qty-sm{height:40px}
.qty-sm button{width:36px}
.dlines{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.dline{display:flex;gap:12px;align-items:center;font-size:14px}
.pacc{border-top:1px solid var(--line)}
.pacc:last-child{border-bottom:1px solid var(--line)}
.pacc .faq-q{min-height:56px;font-size:15px}
.pacc .faq-a{font-size:14px;padding-bottom:16px}
.revsum{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.bignum{font-family:var(--dfam);font-size:88px;line-height:1;font-weight:var(--dweight)}
.mbar{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:16px;align-items:center;z-index:35}

/* ---------- KitBuilder ---------- */
.builder{padding:24px 0 112px}
.is-m .builder{padding:8px 0 64px}
.stepper{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line);margin:40px 0 8px}
.stp{padding:16px 0;font-size:14px;color:var(--muted);position:relative;display:flex;gap:10px;align-items:center;min-height:56px}
.stp.on{color:var(--ink);font-weight:500}
.stp.on::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--rule)}
.stp.done{color:var(--ink)}
.stp-n{width:28px;height:28px;border-radius:50%;border:1px solid currentColor;display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.stp.done .stp-n{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mstep{margin:24px 0 8px;display:flex;flex-direction:column;gap:10px}
.bstep{display:flex;flex-direction:column;gap:40px;padding:32px 0}
.is-m .bstep{gap:32px;padding:24px 0}
.fs{display:flex;flex-direction:column;gap:14px}
.bnav{display:flex;align-items:center;gap:16px;border-top:1px solid var(--line);padding-top:24px}
.is-m .bnav .btn{flex:1}
.aside{background:var(--surface);padding:32px;border-radius:var(--radius);display:flex;flex-direction:column;gap:4px;position:sticky;top:100px;margin-top:40px}
.dir-a .aside{background:transparent;border:1px solid var(--line)}
.kv{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv span:last-child{text-align:right}
.ticks{display:flex;flex-direction:column;gap:10px;font-size:14px;margin-top:20px}
.ticks li{display:flex;gap:10px;align-items:center}
.fromdesign{display:flex;gap:16px;align-items:center;background:var(--surface);padding:12px;margin-top:24px;border-radius:var(--radius)}
.fromdesign-art{width:64px;flex:none;background:var(--slot);display:block;border-radius:var(--radius)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.is-m .two{grid-template-columns:1fr}

/* ---------- Thank you ---------- */
.thanks{padding:96px 0 120px}
.is-m .thanks{padding:48px 0 64px}
.narrow{max-width:720px;margin:0 auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px}
.okmark{width:64px;height:64px;border-radius:50%;border:1px solid var(--ink);display:flex;align-items:center;justify-content:center}
.dir-c .okmark{background:var(--accent);border-color:var(--accent)}
.dir-b .okmark{border-color:var(--accent);color:var(--accent)}
.next{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;text-align:left;width:100%;margin:24px 0}
.next li{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:6px}
.is-m .next{grid-template-columns:1fr;gap:16px}

/* ---------- KitDesigner ---------- */
.dz-head{display:flex;flex-direction:column;gap:16px;padding:16px 0 40px;max-width:760px}
.dz{padding-bottom:112px;align-items:start}
.dz-controls{display:flex;flex-direction:column}
.dsec{padding:24px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.dsec-h{display:flex;gap:12px;align-items:baseline}
.dnum{font-family:var(--dfam);font-size:20px;color:var(--muted);font-weight:var(--dweight)}
.stylecard{border:1px solid var(--line-strong);padding:8px;display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;border-radius:var(--radius);font-size:14px;font-weight:500}
.stylecard.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.stylecard-art{display:block;background:var(--slot);border-radius:var(--radius)}
.dz-preview{position:sticky;top:100px;display:flex;flex-direction:column;gap:16px;padding-left:24px}
.is-m .dz-preview{position:static;padding-left:0;order:-1}
.is-m .dz{display:flex;flex-direction:column;gap:24px}
.preview-stage{background:var(--slot);display:block;padding:56px 96px;border-radius:var(--radius);position:relative}
.is-m .preview-stage{padding:16px 64px}
.var{border:1px solid transparent;padding:8px;width:100%;display:flex;flex-direction:column;gap:8px;text-align:left;border-radius:var(--radius);font-size:14px}
.var.on{border-color:var(--ink)}
.var-art{display:block;background:var(--slot);border-radius:var(--radius)}
.var-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.is-m .var-grid{gap:6px}
.is-m .var{padding:4px;font-size:12px}
.genbar{height:2px;background:var(--line);overflow:hidden;position:relative;display:block}
.genbar::after{content:'';position:absolute;top:0;bottom:0;left:0;width:40%;background:var(--ink);animation:nnslide 1.2s ease-in-out infinite}
@keyframes nnslide{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
.aspect45{aspect-ratio:4 / 5}

/* ---------- Club shops ---------- */
.closebar{border-bottom:1px solid var(--line);background:var(--surface);font-size:14px;padding:12px 0;text-align:center;border-top:2px solid var(--rule)}
.dir-c .closebar{border-top-color:var(--accent);border-top-width:3px}
.club-head{display:flex;gap:28px;align-items:center;padding:8px 0 40px}
.is-m .club-head{flex-direction:column;align-items:flex-start;gap:16px;padding-bottom:24px}
.clubcard{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:24px;border:1px solid var(--line);width:100%;text-align:left;border-radius:var(--radius);transition:border-color .2s}
.clubcard:hover{border-color:var(--ink)}
.is-m .clubcard{padding:16px}
.setup{display:flex;justify-content:space-between;align-items:center;gap:24px;background:var(--surface);padding:40px;margin:64px 0 112px;border-radius:var(--radius)}
.is-m .setup{flex-direction:column;align-items:stretch;padding:24px;margin:40px 0 64px}
.howclub{margin:64px 0 112px}
.is-m .howclub{margin:40px 0 64px}

/* ---------- drawers, sheets, overlays ---------- */
.shade{position:absolute;inset:0;background:rgba(10,10,10,.34);z-index:50;animation:nnfade .2s ease}
.drawer{position:absolute;top:0;right:0;bottom:0;width:440px;background:var(--bg);z-index:51;display:flex;flex-direction:column;animation:nnin .28s ease both;border-left:1px solid var(--line)}
@keyframes nnin{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.drawer.left{left:0;right:auto;border-left:0;border-right:1px solid var(--line);animation-name:nninl}
@keyframes nninl{from{transform:translateX(-24px);opacity:0}to{transform:none;opacity:1}}
.is-m .drawer{width:100%;border:0}
.drawer-h{min-height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 24px;border-bottom:1px solid var(--line);flex:none}
.is-m .drawer-h{padding:0 6px 0 16px;min-height:60px}
.drawer-b{flex:1;overflow-y:auto;padding:24px}
.is-m .drawer-b{padding:20px 16px}
.drawer-f{border-top:1px solid var(--line);padding:20px 24px 24px;display:flex;flex-direction:column;gap:10px;flex:none}
.is-m .drawer-f{padding:16px}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;background:var(--bg);z-index:51;display:flex;flex-direction:column;animation:nnup .28s ease both}
@keyframes nnup{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.ship{padding:16px 24px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px;flex:none}
.is-m .ship{padding:14px 16px}
.ci{display:grid;grid-template-columns:84px 1fr auto;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.ci:first-child{padding-top:0}
.ci-img{display:block;background:var(--slot);border-radius:var(--radius);overflow:hidden}
.ci-info{display:flex;flex-direction:column;gap:4px}
.ci-row{display:flex;align-items:center;gap:16px;margin-top:8px}
.kv0{display:flex;justify-content:space-between;font-size:16px}
.upsell{margin-top:24px;padding:16px;background:var(--surface);font-size:14px;border-radius:var(--radius);display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px}
.mrow{min-height:60px;display:flex;justify-content:space-between;align-items:center;width:100%;border-bottom:1px solid var(--line);font-family:var(--dfam);font-size:26px;text-transform:var(--dcase);font-weight:var(--dweight);letter-spacing:var(--dtrack)}
.dir-b .mrow{font-size:23px}
.macc{min-height:52px;display:flex;justify-content:space-between;align-items:center;width:100%;border-bottom:1px solid var(--line);font-size:16px;font-weight:500}
.macc-body{padding:4px 0 12px;border-bottom:1px solid var(--line)}
.msub{display:flex;align-items:center;min-height:44px;padding-left:12px;font-size:15px;color:var(--muted);width:100%}
.mrow2{min-height:52px;display:flex;justify-content:space-between;align-items:center;width:100%;border-bottom:1px solid var(--line);font-size:16px;font-weight:500}

/* ---------- ChatWidget ---------- */
.fab{position:absolute;right:24px;bottom:24px;width:56px;height:56px;border-radius:50%;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;z-index:40;transition:transform .2s}
.fab:hover{transform:translateY(-2px)}
.is-m .fab{right:16px;bottom:16px}
.fab.up{bottom:92px}
.chat{position:absolute;right:24px;bottom:24px;width:376px;height:576px;background:var(--bg);border:1px solid var(--line);z-index:45;display:flex;flex-direction:column;animation:nnup .24s ease both;border-radius:var(--radius);overflow:hidden}
.is-m .chat{left:0;right:0;bottom:0;width:auto;height:82%;border-width:1px 0 0}
.chat-h{display:flex;align-items:center;justify-content:space-between;padding:12px 8px 12px 20px;border-bottom:1px solid var(--line);flex:none}
.chat-b{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:84%;padding:12px 14px;font-size:14px;background:var(--surface);border-radius:14px 14px 14px 4px;line-height:1.45;align-self:flex-start}
.bub.me{align-self:flex-end;background:var(--ink);color:var(--bg);border-radius:14px 14px 4px 14px}
.qr{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chat-f{border-top:1px solid var(--line);padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:none}
.chat-in{display:flex;gap:6px;align-items:center}
.chat-in .input{min-height:44px}

.dir-c .nav{gap:20px}
.dir-c .hdr-in{gap:24px}

/* ===== Clean Sport · motion layer ===== */
:root{--ease:cubic-bezier(.2,.7,.2,1);--spring:cubic-bezier(.2,1.25,.35,1)}
@keyframes mUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes mFade{from{opacity:0}to{opacity:1}}
@keyframes mLine{from{transform:translateY(108%)}to{transform:none}}
@keyframes mFloat{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-14px) rotate(calc(var(--r,0deg) + 1.5deg))}}
@keyframes mKitIn{from{opacity:0;transform:translateY(70px) scale(.9) rotate(10deg)}to{opacity:1;transform:none}}
@keyframes mMarq{to{transform:translateX(-50%)}}
@keyframes mPage{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes mSlide{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes mBump{0%{transform:scale(1)}35%{transform:scale(1.5)}100%{transform:scale(1)}}
@keyframes mDraw{to{stroke-dashoffset:0}}
@keyframes mPop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes mConf{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(var(--rot));opacity:0}}
@keyframes mType{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
@keyframes mShine{from{transform:translateX(-140%) skewX(-20deg)}to{transform:translateX(260%) skewX(-20deg)}}
@keyframes mRing{0%{transform:scale(1);opacity:.45}100%{transform:scale(1.7);opacity:0}}

/* entrance */
.m-up{animation:mUp .85s var(--ease) both;animation-delay:var(--d,0s)}
.hx-title .ln{display:block;clip-path:inset(0 -100vw 0 -100vw);padding-bottom:.05em;margin-bottom:-.05em}
.hx-title .ln>span{display:inline-block;animation:mLine 1s var(--ease) both;animation-delay:var(--d,0s)}
main[data-key]{animation:mPage .6s var(--ease) both}
main[data-key] > .wrap > .hero .h1,main[data-key] .cat-head h1,main[data-key] .dz-head h1{animation:mUp .9s .1s var(--ease) both}

/* scroll reveal (engine adds .m-rv, then .m-in) */
.m-rv{opacity:0;transform:translateY(32px);transition:opacity .9s var(--ease),transform .9s var(--ease);transition-delay:var(--rd,0s)}
.m-rv.m-in{opacity:1;transform:none}

/* progress + header */
.m-prog{position:absolute;top:0;left:0;right:0;height:3px;z-index:70;pointer-events:none}
.m-prog span{display:block;height:100%;background:var(--accent);transform-origin:left;transform:scaleX(0)}
.hdr{transition:background .3s,backdrop-filter .3s}
.hdr-in{transition:height .35s var(--ease)}
.nn.m-scrolled .hdr{background:rgba(255,255,255,.88);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px)}
.nn.m-scrolled.is-d .hdr-in{height:64px}
.navlink::after{transition:transform .35s var(--ease)}

/* hero stage */
.dir-c .hero.hero-x{align-items:center;padding:40px 0 80px}
.dir-c .hero-x .hero-text{grid-column:1 / span 6;grid-row:1;padding:0 24px 0 0}
.hero-x .h1{font-size:clamp(64px,7.4vw,112px);line-height:.9}
.hero-x .hero-text{min-width:0}
.hx-title{overflow-wrap:break-word}
.dir-c{--dfam:'Barlow Condensed','Arial Narrow','Roboto Condensed','Helvetica Neue',sans-serif}
.hero-stage{grid-column:7 / span 6;grid-row:1;position:relative;height:700px}
.hx-photo{position:absolute;top:0;left:0;right:16%;bottom:14%;transition:transform .6s var(--ease)}
.hx-kits{position:absolute;inset:0;pointer-events:none;transition:transform .6s var(--ease)}
.hx-kit{position:absolute;width:46%;animation:mKitIn 1.2s var(--spring) both}
.hx-kit .hx-float{animation:mFloat 6.5s ease-in-out infinite}
.hx-k0{right:-2%;bottom:0;--r:-6deg;animation-delay:.45s;z-index:3}
.hx-k1{right:31%;bottom:3%;width:36%;--r:5deg;animation-delay:.6s;z-index:2}
.hx-k1 .hx-float{animation-delay:-2.2s}
.hx-k2{right:0;top:4%;width:30%;--r:9deg;animation-delay:.75s;z-index:1}
.hx-k2 .hx-float{animation-delay:-4.1s}
.hx-card{position:absolute;left:24px;bottom:0;background:var(--bg);border:1px solid var(--line);padding:16px 20px;display:flex;flex-direction:column;gap:4px;z-index:4;border-radius:var(--radius)}
.is-m .hero-x .h1{font-size:50px}
.is-m .hero-x .hero-text{padding:0}
.is-m .hero-stage{height:460px;width:100%}
.is-m .hx-photo{right:0;bottom:22%}
.is-m .hx-kit{width:52%}.is-m .hx-k1{width:42%;right:36%}.is-m .hx-k2{width:34%}
.is-m .hx-card{left:0}

/* marquee */
.marquee{overflow:hidden;background:var(--ink);color:#FFFFFF;padding:20px 0;margin-top:56px}
.is-m .marquee{margin-top:32px;padding:14px 0}
.marquee-track{display:flex;align-items:center;width:max-content;animation:mMarq 40s linear infinite}
.marquee:hover .marquee-track{animation-play-state:paused}
.mq-item{font-family:var(--dfam);text-transform:uppercase;font-weight:600;font-size:36px;letter-spacing:.04em;padding:0 28px;white-space:nowrap;line-height:1}
.is-m .mq-item{font-size:24px;padding:0 18px}
.mq-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}

/* bento sport tiles */
.dir-c [data-section="SportTiles"] .g3{grid-auto-rows:320px;counter-reset:tile}
.dir-c [data-section="SportTiles"] .tile{position:relative;overflow:hidden;border-radius:var(--radius);counter-increment:tile;height:100%}
.dir-c [data-section="SportTiles"] .tile:first-child{grid-row:span 2;grid-column:span 2}
.dir-c [data-section="SportTiles"] .tile-img{aspect-ratio:auto;height:100%;transition:transform 1s var(--ease)}
.dir-c [data-section="SportTiles"] .tile:hover .tile-img{transform:scale(1.06);opacity:1}
.dir-c [data-section="SportTiles"] .tile::before{content:counter(tile,decimal-leading-zero);position:absolute;top:18px;left:20px;z-index:2;font-family:var(--dfam);font-weight:600;font-size:15px;letter-spacing:.12em}
.dir-c [data-section="SportTiles"] .slot-label{top:46px;bottom:auto}
.dir-c [data-section="SportTiles"] .tile-meta{position:absolute;left:12px;right:12px;bottom:12px;background:var(--bg);padding:14px 72px 14px 18px;z-index:2;flex-direction:column;align-items:flex-start;gap:2px;border-radius:var(--radius);transition:transform .5s var(--ease)}
.dir-c [data-section="SportTiles"] .tile:hover .tile-meta{transform:translateY(-4px)}
.dir-c [data-section="SportTiles"] .tile-meta::after{content:'→';position:absolute;right:14px;top:50%;width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:20px;transform:translate(10px,-50%) scale(.5);opacity:0;transition:all .45s var(--spring)}
.dir-c [data-section="SportTiles"] .tile:hover .tile-meta::after,.dir-c [data-section="SportTiles"] .tile:focus-visible .tile-meta::after{opacity:1;transform:translate(0,-50%) scale(1)}
.dir-c [data-section="SportTiles"] .tile:first-child .h3{font-size:56px}
.is-m.dir-c [data-section="SportTiles"] .g3{grid-auto-rows:190px}
.is-m.dir-c [data-section="SportTiles"] .tile:first-child{grid-row:span 1;grid-column:span 2}
.is-m.dir-c [data-section="SportTiles"] .tile:first-child .h3{font-size:34px}
.is-m.dir-c [data-section="SportTiles"] .tile-meta{padding:10px 12px;left:8px;right:8px;bottom:8px}
.is-m.dir-c [data-section="SportTiles"] .slot-label{display:none}

/* how it works line */
.steps{position:relative}
.dir-c .step{border-top:2px solid var(--line)}
.steps::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform 1.6s .2s var(--ease);z-index:1}
.steps.m-in::before{transform:none}
.is-m .steps::before{display:none}
.step-n{transition:transform .6s var(--spring)}
.step:hover .step-n{transform:translateX(6px)}

/* product cards */
.pc{perspective:900px}
.pc-media{transition:transform .6s var(--ease);transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transform-style:preserve-3d}
.pc-name{background-image:linear-gradient(currentColor,currentColor);background-size:0 1px;background-repeat:no-repeat;background-position:0 100%;transition:background-size .45s var(--ease);display:inline;padding-bottom:2px}
.pc:hover .pc-name{background-size:100% 1px}
.pc-price{margin-top:6px}
.pc .dots .dot{transition:transform .3s var(--spring)}
.pc:hover .dots .dot{transform:scale(1.2)}

/* buttons */
.btn{position:relative;overflow:hidden;transition:opacity .2s,transform .35s var(--ease)}
.btn::after{content:'';position:absolute;top:0;bottom:0;left:0;width:40%;background:rgba(255,255,255,.5);transform:translateX(-140%) skewX(-20deg);pointer-events:none}
.btn:hover{opacity:1}
.btn:hover::after{animation:mShine .9s var(--ease)}
.btn:active{transform:scale(.97)}
.btn .ic-s{transition:transform .35s var(--ease)}
.btn:hover .ic-s{transform:translateX(4px)}
.btn-line{transition:background .2s,color .2s,transform .3s var(--ease)}
.dir-c .btn-line:hover{background:var(--ink);color:#FFFFFF}
.tlink{transition:text-underline-offset .25s var(--ease),text-decoration-thickness .15s}
.tlink:hover{text-underline-offset:4px}

/* mega menu + search stagger */
.mega-list .mega-link,.mega-groups > div,.mega-side,.mega-feat,.mega-feat-s,.search .chips > *{animation:mUp .5s var(--ease) both}
.mega-list .mega-link:nth-of-type(1){animation-delay:.03s}.mega-list .mega-link:nth-of-type(2){animation-delay:.07s}.mega-list .mega-link:nth-of-type(3){animation-delay:.11s}
.mega-list .mega-link:nth-of-type(4){animation-delay:.15s}.mega-list .mega-link:nth-of-type(5){animation-delay:.19s}.mega-list .mega-link:nth-of-type(6){animation-delay:.23s}
.mega-groups > div:nth-child(2){animation-delay:.05s}.mega-groups > div:nth-child(3){animation-delay:.1s}.mega-groups > div:nth-child(4){animation-delay:.15s}.mega-groups > div:nth-child(5){animation-delay:.2s}.mega-groups > div:nth-child(6){animation-delay:.25s}
.mega-side{animation-delay:.12s}.mega-feat,.mega-feat-s{animation-delay:.18s}
.mega-slot{transition:transform .8s var(--ease)}
.mega-feat:hover .mega-slot,.mega-feat-s:hover .mega-slot{transform:scale(1.02)}
.mega-link::after{content:'→';font-family:var(--bfam);font-size:18px;opacity:0;transform:translateX(-8px);transition:all .3s var(--ease)}
.mega-link:hover::after{opacity:1;transform:none}
.mega-link:hover .mega-hint{display:none}

/* drawers, sheets, chat */
.drawer{animation:nnin .55s var(--spring) both}
.drawer.left{animation:nninl .55s var(--spring) both}
.sheet{animation:nnup .5s var(--spring) both}
.ci,.mrow,.macc,.mrow2{animation:mUp .5s var(--ease) both}
.ci:nth-child(2){animation-delay:.07s}.ci:nth-child(3){animation-delay:.14s}
.mrow:nth-of-type(1){animation-delay:.05s}.mrow:nth-of-type(2){animation-delay:.09s}.mrow:nth-of-type(3){animation-delay:.13s}.mrow:nth-of-type(4){animation-delay:.17s}.mrow:nth-of-type(5){animation-delay:.21s}.mrow:nth-of-type(6){animation-delay:.25s}
.prog > span{transition:width .8s var(--ease)}
.count.m-bump{animation:mBump .55s var(--spring)}
.chat{animation:nnup .45s var(--spring) both;transform-origin:bottom right}
.bub{animation:mUp .4s var(--ease) both}
.typing{display:flex;gap:5px;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:mType 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.qr .chip{animation:mUp .4s var(--ease) both}
.qr .chip:nth-child(2){animation-delay:.05s}.qr .chip:nth-child(3){animation-delay:.1s}.qr .chip:nth-child(4){animation-delay:.15s}
.fab{overflow:visible}
.fab::after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid var(--ink);animation:mRing 2.8s ease-out infinite;pointer-events:none}
.fab svg{transition:transform .35s var(--spring)}
.fab:hover svg{transform:scale(1.15) rotate(-8deg)}
.m-fly{position:fixed;width:18px;height:18px;border-radius:50%;background:#D4FF3A;border:2px solid #0E1B33;z-index:9999;pointer-events:none;left:0;top:0}

/* forms & builder */
.bstep{animation:mSlide .5s var(--ease) both}
.chip,.opt,.sz,.sw,.stylecard,.var,.clubcard,.thumb{transition:background .2s,border-color .2s,box-shadow .2s,transform .25s var(--spring),color .2s}
.chip:active,.opt:active,.sz:active,.sw:active{transform:scale(.94)}
.opt.on .box svg,.stp.done .stp-n svg{animation:mPop .35s var(--spring) both}
.sw.on::after{animation:mPop .35s var(--spring) both}
.clubcard:hover{transform:translateY(-4px)}
.drop{transition:border-color .2s,background .2s}
.drop:hover{background:var(--bg)}
.alert{animation:mUp .45s var(--ease) both}
.faq-a{animation:mUp .4s var(--ease) both}
.faq-q svg{transition:transform .35s var(--spring)}
.faq-q:hover svg{transform:rotate(90deg)}
.gal-main > *{animation:mFade .45s var(--ease) both}
.thumb:hover{transform:translateY(-3px)}
.skel{background:#E8ECF2;position:relative;overflow:hidden}

/* thank you */
.okwrap{position:relative;display:inline-flex}
.okmark{animation:mPop .6s .1s var(--spring) both}
.okmark path{stroke-dasharray:24;stroke-dashoffset:24;animation:mDraw .5s .55s ease forwards}
.confetti{position:absolute;left:50%;top:50%;width:0;height:0}
.confetti i{position:absolute;width:8px;height:12px;left:-4px;top:-6px;animation:mConf 1.5s var(--ease) both;animation-delay:calc(.45s + var(--cd,0s));border-radius:1px}
.confetti i.c0{background:#D4FF3A}.confetti i.c1{background:#0E1B33}.confetti i.c2{background:#AEB8C8;border-radius:50%;width:9px;height:9px}
.next li{animation:mUp .6s var(--ease) both}
.next li:nth-child(1){animation-delay:.7s}.next li:nth-child(2){animation-delay:.8s}.next li:nth-child(3){animation-delay:.9s}

@media (prefers-reduced-motion: reduce){
 .nn *,.nn *::before,.nn *::after{animation:none!important;transition:none!important}
 .m-rv{opacity:1!important;transform:none!important}
 .marquee-track{transform:none}
}

.hx-photo .slot-label{top:16px;bottom:auto;right:auto}

/* ================= Home v3 · retail sections ================= */
/* HeroSlideshow — keeps the original hero layout (image left, text right) */
.slider{padding:32px 0 88px;position:relative}
.sl-stage{position:relative}
.sl{position:absolute;inset:0;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;align-items:center;visibility:hidden;pointer-events:none}
.sl.on{position:relative;visibility:visible;pointer-events:auto}
.sl-media{grid-column:1 / span 7;height:640px;clip-path:inset(0 100% 0 0);transition:clip-path 1.1s var(--ease),visibility 0s 1.1s}
.sl.on .sl-media{clip-path:inset(0 0 0 0);transition:clip-path 1.1s var(--ease)}
.sl:not(.on) .sl-media{clip-path:inset(0 0 0 100%)}
.sl-text{grid-column:8 / span 5;padding:0 0 96px 24px;display:flex;flex-direction:column;gap:24px}
.sl-text > *{opacity:0;transform:translateY(24px);transition:opacity .6s var(--ease),transform .7s var(--ease)}
.sl.on .sl-text > *{opacity:1;transform:none}
.sl.on .sl-a{transition-delay:.25s}.sl.on .sl-b{transition-delay:.35s}.sl.on .sl-c{transition-delay:.5s}.sl.on .sl-d{transition-delay:.6s}
.sl-text .h1{font-size:clamp(56px,6.2vw,96px)}
.sl-ctrl{position:absolute;bottom:0;right:0;width:calc((100% - 11 * 24px) / 12 * 5 + 4 * 24px);padding-left:24px;display:flex;align-items:center;gap:16px;z-index:3}
.sl-count{font-family:var(--dfam);font-size:18px;letter-spacing:.08em;font-variant-numeric:tabular-nums;white-space:nowrap}
.sl-bars{display:flex;gap:6px;flex:1;max-width:220px}
.sl-bar{flex:1;height:44px;display:flex;align-items:center;position:relative}
.sl-bar::before{content:'';position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;background:var(--line);border-radius:2px}
.sl-bar > span{position:absolute;left:0;top:50%;height:3px;margin-top:-1.5px;width:100%;background:var(--ink);border-radius:2px;transform:scaleX(0);transform-origin:left}
.sl-bar.done > span{transform:scaleX(1)}
.sl-bar.on > span{animation:mBar 6.5s linear forwards}
.slider.paused .sl-bar.on > span{animation-play-state:paused}
@keyframes mBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.sl-arrow{width:48px;height:48px;border-radius:50%;border:1px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;transition:background .25s,color .25s,transform .3s var(--spring);flex:none}
.sl-arrow:hover{background:var(--ink);color:#FFFFFF}
.sl-arrow:active{transform:scale(.92)}
.is-m .slider{padding:16px 0 48px}
.is-m .sl{display:flex;flex-direction:column;align-items:stretch;gap:24px}
.is-m .sl-media{height:340px;width:100%}
.is-m .sl-text{padding:0 0 72px;gap:16px}
.is-m .sl-text .h1{font-size:46px}
.is-m .sl-text .cta{flex-direction:column;align-items:stretch;gap:4px}
.is-m .sl-text .cta .btn{width:100%}
.is-m .sl-ctrl{width:100%;padding-left:0}

/* PromoBanner */
.promo-sec{padding:0 0 112px}
.is-m .promo-sec{padding:0 0 64px}
.promo{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;background:var(--surface);border-radius:var(--radius);overflow:hidden;align-items:stretch}
.promo-text{grid-column:1 / span 6;padding:64px;display:flex;flex-direction:column;gap:20px;justify-content:center}
.promo-media{grid-column:7 / span 6;min-height:380px;border-radius:0}
.promo-media{transition:transform 1.2s var(--ease)}
.promo:hover .promo-media{transform:scale(1.03)}
.is-m .promo{display:flex;flex-direction:column}
.is-m .promo-text{padding:28px 20px}
.is-m .promo-media{min-height:220px}
.is-m .promo .cta{flex-direction:column;align-items:stretch;gap:4px}

/* ShopTheLook */
.head-center{flex-direction:column;align-items:center;text-align:center;gap:12px}
.head-center .eyebrow{justify-content:center}
.look{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;align-items:stretch}
.look-media{grid-column:1 / span 5;min-height:720px;position:relative}
.look-media .slot-label{top:16px;bottom:auto}
.look-grid{grid-column:6 / span 7;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px 20px;align-content:start}
.lk{position:relative;border-radius:var(--radius);transition:box-shadow .3s}
.lk.on .pc-media{box-shadow:0 0 0 2px var(--ink)}
.qadd{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;background:var(--bg);color:var(--ink);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.7);transition:all .35s var(--spring);z-index:2}
.lk:hover .qadd,.qadd:focus-visible{opacity:1;transform:scale(1)}
.qadd:hover{background:var(--accent);border-color:var(--accent)}
.is-m .qadd{opacity:1;transform:none;width:36px;height:36px;top:8px;right:8px}
.hot{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;display:flex;align-items:center;justify-content:center;z-index:2}
.hot-dot{width:16px;height:16px;border-radius:50%;background:#FFFFFF;border:4px solid var(--ink);position:relative;transition:transform .3s var(--spring)}
.hot-dot::after{content:'';position:absolute;inset:-8px;border-radius:50%;border:2px solid #FFFFFF;animation:mRing 2.2s ease-out infinite}
.hot.on .hot-dot,.hot:hover .hot-dot{transform:scale(1.25);background:var(--accent)}
.hot-tip{position:absolute;left:34px;top:50%;transform:translate(-6px,-50%);white-space:nowrap;background:var(--ink);color:#FFFFFF;font-size:12px;padding:6px 10px;border-radius:var(--radius);opacity:0;pointer-events:none;transition:all .3s var(--ease)}
.hot:hover .hot-tip,.hot.on .hot-tip{opacity:1;transform:translate(0,-50%)}
.look-foot{display:flex;justify-content:center;align-items:center;gap:24px;margin-top:40px}
.is-m .look{display:flex;flex-direction:column;gap:24px}
.is-m .look-media{min-height:440px}
.is-m .look-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 12px}
.is-m .look-foot{flex-direction:column;gap:4px}

/* AccessoriesRow */
.acc-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:40px}
.acc-head .eyebrow{margin-bottom:16px}
.pills{display:inline-flex;gap:4px;padding:4px;background:var(--surface);border-radius:999px}
.pill{min-height:44px;padding:0 20px;border-radius:999px;font-family:var(--dfam);text-transform:uppercase;letter-spacing:.07em;font-weight:600;font-size:15px;color:var(--muted);transition:background .3s var(--ease),color .3s}
.pill:hover{color:var(--ink)}
.pill.on{background:var(--ink);color:#FFFFFF}
.acc-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:16px;animation:mFade .5s var(--ease) both}
.acc{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:8px 0;animation:mUp .55s var(--ease) both}
.acc:nth-child(2){animation-delay:.04s}.acc:nth-child(3){animation-delay:.08s}.acc:nth-child(4){animation-delay:.12s}.acc:nth-child(5){animation-delay:.16s}.acc:nth-child(6){animation-delay:.2s}.acc:nth-child(7){animation-delay:.24s}
.acc-ic{width:128px;height:128px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--ink);transition:background .35s var(--ease),color .35s,transform .45s var(--spring);margin-bottom:8px}
.acc-svg{width:52px;height:52px;transition:transform .45s var(--spring)}
.acc:hover .acc-ic{background:var(--ink);color:#FFFFFF;transform:translateY(-6px)}
.acc:hover .acc-svg{transform:scale(1.1) rotate(-6deg)}
.acc-name{font-family:var(--dfam);text-transform:uppercase;letter-spacing:.04em;font-weight:600;font-size:18px;line-height:1.1}
.is-m .acc-head{flex-direction:column;align-items:flex-start}
.is-m .acc-row{display:flex;overflow-x:auto;gap:12px;scroll-snap-type:x mandatory;padding-bottom:8px;margin:0 -16px;padding-left:16px;padding-right:16px}
.is-m .acc{flex:0 0 108px;scroll-snap-align:start}
.is-m .acc-ic{width:96px;height:96px}
.is-m .acc-svg{width:40px;height:40px}
.is-m .acc-name{font-size:15px}

/* BundleSpotlight */
.bundle{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;align-items:stretch}
.bundle-media{grid-column:1 / span 6;min-height:680px}
.bundle-info{grid-column:8 / span 5;display:flex;flex-direction:column;gap:20px;justify-content:center}
.bundle-main{display:grid;grid-template-columns:200px 1fr;gap:24px;align-items:center;animation:mSlide .5s var(--ease) both}
.bundle-art{display:block;background:var(--surface);border-radius:var(--radius)}
.bundle-copy{display:flex;flex-direction:column;gap:6px}
.addons{border-top:1px solid var(--line);padding-top:20px;display:flex;flex-direction:column;gap:12px}
.addon{display:flex;align-items:center;gap:14px;padding:8px;border:1px solid var(--line);border-radius:var(--radius);transition:border-color .2s,transform .3s var(--ease)}
.addon:hover{border-color:var(--ink);transform:translateX(4px)}
.addon-art{width:56px;flex:none;background:var(--surface);border-radius:var(--radius);display:block;overflow:hidden}
.qadd-sm{position:static;opacity:1;transform:none;width:40px;height:40px;flex:none}
.is-m .bundle{display:flex;flex-direction:column;gap:28px}
.is-m .bundle-media{min-height:360px}
.is-m .bundle-main{grid-template-columns:120px 1fr;gap:16px}
.is-m .bundle-info .cta{flex-direction:column;align-items:stretch;gap:4px}

/* OnThePitch reels (dark) */
.reels{background:#0E1B33;color:#FFFFFF;padding:96px 0}
.is-m .reels{padding:56px 0}
.reels .eyebrow{color:#FFFFFF}
.reels-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:40px}
.reels-head .eyebrow{margin-bottom:16px}
.reels-nav{display:flex;gap:10px}
.reels .sl-arrow{border-color:rgba(255,255,255,.5);color:#FFFFFF}
.reels .sl-arrow:hover{background:#FFFFFF;color:#0E1B33}
.reel-track{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px}
.reel-track::-webkit-scrollbar{display:none}
.reel{flex:0 0 280px;scroll-snap-align:start;display:flex;flex-direction:column;gap:14px;text-align:left;color:#FFFFFF}
.reel-media{display:block;position:relative;aspect-ratio:9 / 16;background:#1B2A48;border-radius:var(--radius);overflow:hidden;transition:transform .6s var(--ease)}
.reel:hover .reel-media{transform:translateY(-6px)}
.reel-label{position:absolute;left:16px;right:16px;top:16px;font-size:12px;color:#AEB8C8;line-height:1.35}
.play{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;transition:all .4s var(--spring)}
.reel:hover .play{background:var(--accent);color:#0E1B33;border-color:var(--accent);transform:scale(1.12)}
.reel-bar{position:absolute;left:16px;right:16px;bottom:16px;height:3px;background:rgba(255,255,255,.2);border-radius:2px;overflow:hidden}
.reel-bar > span{display:block;height:100%;background:#FFFFFF;transform:scaleX(0);transform-origin:left}
.reel:hover .reel-bar > span{animation:mBar 4s linear forwards}
.reel-cap{display:flex;flex-direction:column;gap:2px}
.reel-cap .xs{color:#AEB8C8}
.is-m .reels-head{flex-direction:row;align-items:flex-end}
.is-m .reels-nav{display:none}
.is-m .reel{flex-basis:200px}

/* trust + marquee now sit lower on the page */
.trust-wrap{padding-bottom:0}
.trust-wrap .trust{border-top:0}
.bundle-info .pills,.acc-head .pills{align-self:flex-start}
.fab{box-shadow:0 0 0 2px #FFFFFF}
.sl-text .h1{font-size:clamp(52px,5.6vw,88px)}
.sl-media{height:600px}
.promo{border:1px solid var(--line)}
.is-m .sl-text{order:1;padding:0}
.is-m .sl-media{order:2;margin-bottom:64px;height:320px}

/* ================= Home v4 · rhythm + filled media ================= */
.pitch{position:absolute;inset:0;width:100%;height:100%;color:var(--ink);opacity:.07;pointer-events:none}
.reel-media .pitch{color:#FFFFFF;opacity:.07}
.slot > .slot-label{z-index:3}
/* slide art sits inside the photo frame */
.sl-art{position:absolute;inset:8% 8% 12%;display:flex;align-items:flex-end;justify-content:center;gap:2%;z-index:2}
.sl-kit{flex:0 0 30%;opacity:0;transform:translateY(40px);transition:opacity .7s var(--ease),transform .9s var(--spring)}
.sl.on .sl-kit{opacity:1;transform:none}
.sl.on .sl-kit:nth-child(1){transition-delay:.45s}.sl.on .sl-kit:nth-child(2){transition-delay:.58s}.sl.on .sl-kit:nth-child(3){transition-delay:.71s}
.sl-art.lineup .sl-kit:nth-child(2){flex-basis:36%;margin-bottom:4%}
.sl-art.solo{align-items:center}.sl-art.solo .sl-kit{flex-basis:58%}
.sl-art.duo .sl-kit{flex-basis:42%}
.sl-art.duo .sl-kit:nth-child(2){margin-bottom:6%}
.sl-art.shop .sl-kit{flex-basis:48%}
.sl.on .sl-kit .hx-float,.sl.on .sl-art.solo .sl-kit{animation:none}
.sl-art.solo .sl-kit > *{animation:mFloat 6s ease-in-out infinite}
.sl-card{position:absolute;left:24px;bottom:56px;z-index:3;background:var(--bg);border:1px solid var(--line);padding:14px 18px;display:flex;gap:14px;align-items:center;border-radius:var(--radius);opacity:0;transform:translateY(16px);transition:all .6s .8s var(--ease)}
.sl.on .sl-card{opacity:1;transform:none}
.sl-card .crest{width:44px;height:44px}
.is-m .sl-card{left:12px;bottom:44px}
.look-art{position:absolute;left:15%;right:15%;top:50%;transform:translateY(-50%);z-index:1}
.look-art > *{animation:mFloat 7s ease-in-out infinite}
.bundle-big{position:absolute;left:18%;right:18%;top:50%;transform:translateY(-50%);z-index:1;animation:mUp .6s var(--ease) both}
.promo-art{position:absolute;inset:10% 8%;display:flex;align-items:center;justify-content:center;gap:4%;z-index:1}
.promo-art .pa1{flex:0 0 42%}.promo-art .pa2{flex:0 0 30%;margin-top:22%}
.promo-art .pa1 > *{animation:mFloat 7s ease-in-out infinite}
.promo-art .pa2 > *{animation:mFloat 5.5s -2s ease-in-out infinite}

/* rhythm: white → soft band → white → navy → white → soft band */
.trust-top{padding-top:0}
.trust-top .trust{border-top:1px solid var(--line)}
.band-soft{background:var(--surface);border-top:0}
.band-soft .step{border-top-color:#D5DBE5}
[data-section="SportTiles"]{padding-top:96px}
.promo-late{padding:112px 0}
.is-m .promo-late{padding:64px 0}
.promo-late .promo{background:var(--surface);border:0}
[data-section="ClubStories"]{border-top:0}
.marquee{margin-top:0}
.bundle-big{left:0;right:0;top:0;bottom:0;transform:none;display:flex;align-items:center;justify-content:center}
.bundle-big > *{width:62%}
.bundle-main{grid-template-columns:1fr}
.is-m .bundle-main{grid-template-columns:1fr}
.bundle-big > *{width:46%}

html,body{margin:0;height:100%;background:#FFFFFF}
#app>.nn{width:100%!important;height:100vh!important;min-width:1280px}
body{overflow-x:auto;overflow-y:hidden}
</style>
</head>
<body>

<template id="tpl-store"><div class="{{rootClass}}" style="width: {{W}}px; height: {{H}}px" data-section="Store">

</sc-if>

<nav class="nav" aria-label="Main" data-section="SportNav">

<button class="{{n.cls}}" onMouseEnter="{{n.enter}}" onFocus="{{n.enter}}" onClick="{{n.go}}" aria-expanded="{{n.exp}}">{{n.label}}</button>

<!-- MegaMenu · sport template (same for every sport) -->

<button class="tlink" onClick="{{goBuilder}}">Get a free kit mockup<svg class="ic-s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</div>
</div>
</div>

</div>

<!-- Search -->

<input id="nn-search" class="search-input" type="search" placeholder="Search kits, sports, products">
<p class="eyebrow mt24">Popular</p>

</div>

</header>

<!-- ================= HOME ================= -->
<sc-if value="{{isHome}}" hint-placeholder-val="{{true}}">
<main data-key="m1">
<section class="{{sliderCls}}" data-section="HeroSlideshow" aria-roledescription="carousel" aria-label="Featured">
<div class="wrap">
<div class="sl-stage">
<sc-for list="{{slides}}" as="sl" hint-placeholder-count="4">
<div class="{{sl.cls}}" role="group" aria-roledescription="slide" aria-label="{{sl.n}} of 4" aria-hidden="{{sl.hidden}}">
<div class="sl-media slot"><svg class="pitch" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="40" y="40" width="720" height="520"></rect><line x1="400" y1="40" x2="400" y2="560"></line><circle cx="400" cy="300" r="80"></circle><circle cx="400" cy="300" r="4" fill="currentColor"></circle><rect x="40" y="160" width="120" height="280"></rect><rect x="640" y="160" width="120" height="280"></rect><rect x="40" y="240" width="44" height="120"></rect><rect x="716" y="240" width="44" height="120"></rect><path d="M160 250a60 60 0 0 1 0 100M640 250a60 60 0 0 0 0 100"></path></svg><div class="{{sl.artCls}}"><sc-for list="{{sl.arts}}" as="p" hint-placeholder-count="3"><div class="sl-kit"><dc-import name="Art" kind="{{p.kind}}" pattern="{{p.pattern}}" c1="{{p.c1}}" c2="{{p.c2}}" c3="{{p.c3}}" ink="{{p.ink}}" bg="{{p.bg}}" hint-size="100%,100%"></dc-import></div></sc-for></div><sc-if value="{{sl.card}}" hint-placeholder-val="{{false}}"><div class="sl-card"><span class="crest" aria-hidden="true">Crest</span><div><p class="small strong">[Club name] kit shop</p><p class="xs muted">Orders close [date]</p></div></div></sc-if><span class="slot-label"><svg class="ic-s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="1"></rect><circle cx="12" cy="13.5" r="3.5"></circle><path d="M8 7l1.5-3h5L16 7"></path></svg><span>{{sl.photo}}</span></span></div>
<div class="sl-text">
<p class="eyebrow sl-a">{{sl.eb}}</p>
<sc-if value="{{sl.first}}" hint-placeholder-val="{{true}}"><h1 class="d h1 sl-b">{{sl.title}}</h1></sc-if>
<sc-if value="{{sl.notFirst}}" hint-placeholder-val="{{false}}"><h2 class="d h1 sl-b">{{sl.title}}</h2></sc-if>
<p class="lead hero-sub sl-c">{{sl.sub}}</p>
<div class="cta sl-d"><button class="btn" onClick="{{sl.go}}" tabindex="{{sl.tab}}">{{sl.cta}}<svg class="ic-s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button><button class="tlink" onClick="{{sl.go2}}" tabindex="{{sl.tab}}">{{sl.link}}</button></div>
</div>
</div>
</sc-for>
<div class="sl-ctrl">
<span class="sl-count"><strong>{{slideN}}</strong> / 04</span>
<div class="sl-bars"><sc-for list="{{slides}}" as="sl" hint-placeholder-count="4"><button class="{{sl.bar}}" aria-label="Show slide {{sl.n}}" aria-current="{{sl.cur}}" onClick="{{sl.pick}}"><span data-key="{{sl.bkey}}"></span></button></sc-for></div>
<span class="grow"></span>
<button class="sl-arrow" aria-label="Previous slide" onClick="{{slPrev}}"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<button class="sl-arrow" aria-label="Next slide" onClick="{{slNext}}"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
</div>
</div>
</div>
</section>
<div class="wrap trust-wrap trust-top">
<section class="trust" data-section="TrustRow" aria-label="Why clubs choose Nineties90">
<div class="crests">
<sc-for list="{{six}}" as="x" hint-placeholder-count="6"><span class="crest" aria-hidden="true">Crest</span></sc-for>
</div>
<div class="rating">
<span class="stars" aria-label="Rated [4.9] out of 5"><sc-for list="{{five}}" as="x" hint-placeholder-count="5"><svg class="ic-s" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"></path></svg></sc-for></span>
<span class="small"><strong>[4.9]</strong> from [N] reviews</span>
</div>
<ul class="facts-row">
<sc-for list="{{facts}}" as="f" hint-placeholder-count="4"><li class="fact"><span class="fact-k">{{f.k}}</span> <span class="fact-v">{{f.v}}</span></li></sc-for>
</ul>
</section>
</div>

<section class="sec" data-section="SportTiles">
<div class="wrap">
<div class="sec-head">
<div><p class="eyebrow">Shop by sport</p><h2 class="d h2">Kit for every club</h2></div>
<button class="tlink" onClick="{{goClubs}}">Find your club shop</button>
</div>
<div class="g3">

<sc-for list="{{stepper}}" as="s" hint-placeholder-count="4">

</fieldset>
</div>
</sc-if>

<sc-if value="{{st2}}" hint-placeholder-val="{{false}}">
<div class="bstep" data-key="s2">

</fieldset>
